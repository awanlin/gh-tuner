user: awanlin
startDate: 2026-07-07

repos:
  - name: backstage/demo
    scope: all
    cadence: weekly
  - name: backstage/mkdocs-techdocs-core
    scope: all
    cadence: biweekly
  - name: backstage/techdocs-container
    scope: all
    cadence: biweekly
  - name: backstage/github-discord-filter
    scope: all
    cadence: monthly
  - name: backstage/contribfest
    scope: all
    cadence: monthly
  - name: backstage/backstage
    scope:
      issues: all
      prs: filtered
    labels:
      - area:devtools
      - area:search
      - area:techdocs
      - area:home
      - area:documentation
      - area:microsite
    capacity:
      model: fair-share
      ownersSection: Core Maintainers
      inProgressMultiplier: 2
  - name: backstage/community-plugins
    scope:
      issues: all
      prs: filtered
    labels:
      - workspace/azure-devops
      - workspace/linguist
      - workspace/catalog
      - workspace/cost-insights
      - owner/area-maintainers
    capacity:
      model: gap
      ownersSection: Community Plugins
      codeownersTeam: '@backstage/community-plugins-maintainers'
      inProgressMultiplier: 1.5

schedule:
  tuesday:
    mode: issues
    since: last-thursday
  thursday:
    mode: issues
    since: last-tuesday
  friday:
    mode: prs
    since: last-friday

securityKeywords:
  - security
  - CVE
  - GHSA
  - vulnerability
  - vulnerabilities

filters:
  humanEngagementOnly: true
  excludeAwaitingOthers: true
  excludeAuthor: true
  excludeDrafts: true
  excludeChangesRequestedByOthers: true
  excludeAssigned: true
  mentionsRequireInvolvement: true
