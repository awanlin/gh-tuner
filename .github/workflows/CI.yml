name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  version-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check for version label
        run: |
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          for bump in patch minor major; do
            if echo "$labels" | grep -q "\"$bump\""; then
              echo "Found version label: $bump"
              exit 0
            fi
          done
          echo "::error::PR must have a 'patch', 'minor', or 'major' label"
          exit 1

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Type check
        run: yarn tsc:full

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Test
        run: yarn test
