name: CI

on:
  pull_request:

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          pr_version=$(node -p "require('./package.json').version")
          main_version=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          if [ "$pr_version" = "$main_version" ]; then
            echo "::error::Version in package.json ($pr_version) has not been bumped. Update it with: npm version patch|minor|major --no-git-tag-version"
            exit 1
          fi
          echo "Version bumped: $main_version -> $pr_version"

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Type check
        run: yarn tsc:full

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Test
        run: yarn test
